<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandelbrot Set</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mandelbrot Set</h1>
    </header>

    <main>
        <canvas id="canvas"></canvas>

        <aside>
            <div>
                <div class="section-label">Quality</div>
                <div class="ctrl">
                    <div class="ctrl-header"><label>max. iterations</label><span class="val" id="miv">512</span></div>
                    <input type="range" id="mi" min="64" max="2048" step="64" value="512">
                </div>
            </div>

            <div>
                <div class="section-label">Zoom</div>
                <div class="ctrl">
                    <div class="ctrl-header"><label>Zoom</label><span class="val" id="zoomv">1.00×</span></div>
                    <input type="range" id="zoom-slider" min="0" max="300" step="1" value="0">
                </div>
            </div>

            <div>
                <div class="section-label">Locations</div>
                <div class="presets">
                    <button class="preset-btn" onclick="goTo(-0.5,0,1)">Home<span class="sub">full set</span></button>
                    <button class="preset-btn" onclick="goTo(-0.7438307,0.1271400,380.19)">Seahorse Valley<span class="sub">Re=-0.743</span></button>
                    <button class="preset-btn" onclick="goTo(0.2557521,-0.0006903,5200)">Elephant Valley<span class="sub">Re=0.255</span></button>
                    <button class="preset-btn" onclick="goTo(-0.3438989,-0.6112302,4600)">Spiral<span class="sub">Re=-0.344</span></button>
                    <button class="preset-btn" onclick="goTo(-0.7766459,0.1366464,10000)">Sun<span class="sub">Re=-0.776</span></button>
                    <button class="preset-btn" onclick="goTo(-0.3750327,-0.6607451,253.33)">Starfish<span class="sub">Re=-0.375</span></button>
                </div>
            </div>

            <div>
                <div class="section-label">Current View</div>
                <div class="info-box">
                    center x: <span id="inf-cx">-0.5000000</span><br>
                    center y: <span id="inf-cy">0.0000000</span><br>
                    zoom:&nbsp;&nbsp;&nbsp;<span id="inf-zoom">1.00×</span>
                </div>
                <button class="reset-btn" onclick="goTo(-0.5,0,1)" style="margin-top:8px">Reset view</button>
            </div>
        </aside>
    </main>

    <footer>
        <span class="hint">Wheel → zoom</span>
        <span class="hint">Grab → move</span>
        <span class="hint">Pinch → phone zoom</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
