<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjunto de Julia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Conjunto de Julia</h1>
        <span>WebGL · precisión doble</span>
    </header>

    <main>
        <canvas id="canvas"></canvas>

        <aside>
            <div>
                <div class="section-label">Parámetro c = Re + Im·i</div>
                <div class="ctrl">
                    <div class="ctrl-header"><label>Re(c)</label><span class="val" id="crv">-0.700</span></div>
                    <input type="range" id="cr" min="-1.5" max="1.5" step="0.001" value="-0.7">
                </div>
                <div class="ctrl">
                    <div class="ctrl-header"><label>Im(c)</label><span class="val" id="civ">0.270</span></div>
                    <input type="range" id="ci" min="-1.5" max="1.5" step="0.001" value="0.270">
                </div>
            </div>

            <div>
                <div class="section-label">Calidad</div>
                <div class="ctrl">
                    <div class="ctrl-header"><label>Iteraciones máx.</label><span class="val" id="miv">256</span></div>
                    <input type="range" id="mi" min="64" max="1024" step="64" value="256">
                </div>
            </div>

            <div>
                <div class="section-label">Presets</div>
                <div class="presets">
                    <button class="preset-btn" onclick="setPreset(-0.7,0.27015,'Clásico')">Clásico<span class="sub">c=-0.7+0.27i</span></button>
                    <button class="preset-btn" onclick="setPreset(-0.4,0.6,'Espiral')">Espiral<span class="sub">c=-0.4+0.6i</span></button>
                    <button class="preset-btn" onclick="setPreset(0.285,0.01,'Copos')">Copos<span class="sub">c=0.285+0.01i</span></button>
                    <button class="preset-btn" onclick="setPreset(-0.8,0.156,'Ramas')">Ramas<span class="sub">c=-0.8+0.156i</span></button>
                    <button class="preset-btn" onclick="setPreset(-0.54,0.54,'Dragón')">Dragón<span class="sub">c=-0.54+0.54i</span></button>
                    <button class="preset-btn" onclick="setPreset(0.0,0.8,'Círculo')">Círculo<span class="sub">c=0+0.8i</span></button>
                </div>
            </div>

            <div>
                <div class="section-label">Vista actual</div>
                <div class="info-box">
                    centro x: <span id="inf-cx">0.0000</span><br>
                    centro y: <span id="inf-cy">0.0000</span><br>
                    zoom:&nbsp;&nbsp;&nbsp;<span id="inf-zoom">1.00×</span><br>
                    c:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span id="inf-c">-0.700+0.270i</span>
                </div>
                <button class="reset-btn" onclick="resetView()" style="margin-top:8px">Resetear vista</button>
            </div>
        </aside>
    </main>

    <footer>
        <span class="hint">🖱 Rueda → zoom</span>
        <span class="hint">Arrastrá → mover</span>
        <span class="hint">Pinch → zoom móvil</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
